<script>
function cekPassword() {
  var p1 = document.formTes.password1.value;
  var p2 = document.formTes.password2.value;

  if (p1 === "" || p2 === "") {
    alert("Password tidak boleh kosong");
  } 
  else if (p1 !== p2) {
    alert("Dua password tidak sama");
    document.getElementById("hasil").innerText = "Password tidak cocok";
  } 
  else {
    alert("Password cocok!");
    document.getElementById("hasil").innerText = "Password cocok ";
  }
}
</script>

<article>
<h1>Verifikasi Password</h1>
<p>Masukkan password dua kali untuk memastikan kesamaan</p>

<form name="formTes">
  <label>Password Baru</label><br>
  <input type="password" name="password1"><br>

  <label>Konfirmasi Password</label><br>
  <input type="password" name="password2"><br>

  <button type="button" onclick="cekPassword()">Proses</button>
</form>
