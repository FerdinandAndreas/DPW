<!DOCTYPE html>
<html lang="en">
<head>
<title>Download Progress</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial; }

header {
  background: #1f2c76;
  padding: 30px;
  text-align: center;
  font-size: 35px;
  color: white;
}

nav {
  float: left;
  width: 30%;
  background: #ccc;
  padding: 20px;
  min-height: 400px;
}

nav ul { list-style: none; padding: 0; }

nav li { margin-bottom: 10px; }

nav a {
  display: block;
  padding: 8px;
  text-decoration: none;
  color: black;
}

nav a:hover {
  background: #b5b5b5;
}

article {
  float: left;
  width: 70%;
  padding: 20px;
  background: #f1f1f1;
  min-height: 590px;
}

button {
  padding: 10px 20px;
  background: #1f2c76;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #17494b;
}

.progress-container {
  width: 100%;
  background: #ddd;
  margin-top: 20px;
}

.progress-bar {
  width: 0%;
  height: 25px;
  background: #1f2c76;
  text-align: center;
  color: white;
}

section::after { content: ""; display: table; clear: both; }

footer {
  background: #777;
  color: white;
  text-align: center;
  padding: 10px;
}
</style>

<script>
$(document).ready(function(){
  $("#startDownload").click(function(){
    var width = 0;

    var interval = setInterval(function(){
      if (width >= 100) {
        clearInterval(interval);
        alert("Download selesai!");
      } else {
        width++;
        $(".progress-bar").css("width", width + "%");
        $(".progress-bar").text(width + "%");
      }
    }, 50);
  });
});
</script>

</head>
