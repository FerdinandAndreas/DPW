<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }
        

        h2 {
            color: #333;
            border-bottom: 2px solid #9f196d;
            padding-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 8px 5px;
            vertical-align: middle;
        }

        td:first-child {
            width: 160px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
        }

        .inline-input {
            width: 48%;
            display: inline-block;
        }

        .inline-input:last-child {
            width: 50%;
        }

        input[type="submit"] {
            background: #9f196d;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background: #7d1455;
            transition: 0.3s;
        }

        .note {
            color: gray;
            font-style: italic;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <h2>Form Pendaftaran Mahasiswa</h2>

    <form method="POST" action="proses_pendaftaran.php">
        <table>
            <tr>
                <td><label for="nim">NIM:</label></td>
                <td><input type="text" id="nim" name="nim" placeholder="NIM"></td>
            </tr>

            <tr>
                <td><label for="nama">Nama Lengkap:</label></td>
                <td><input type="text" id="nama" name="nama" placeholder="Nama"></td>
            </tr>

            <tr>
                <td><label for="email">E-mail:</label></td>
                <td><input type="email" id="email" name="email" placeholder="Email"></td>
            </tr>

            <tr>
                <td><label>Tempat, Tanggal Lahir:</label></td>
                <td>
                    <input type="text" name="tempat" class="inline-input" placeholder="Tempat">
                    <input type="date" name="tgl_lahir" class="inline-input">
                </td>
            </tr>

            <tr>
                <td><label for="alamat">Alamat:</label></td>
                <td>
                    <textarea id="alamat" name="alamat" rows="3" placeholder="Alamat"></textarea>
                </td>
            </tr>

            <tr>
                <td><label>Gender:</label></td>
                <td>
                    <input type="radio" name="gender" value="Laki-Laki"> Laki-Laki
                    <input type="radio" name="gender" value="Perempuan" checked> Perempuan
                    <span class="note">Gender</span>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" name="kirim" value="Kirim">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
