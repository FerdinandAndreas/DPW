<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pseudo- HTML </title>
  <style>
    p {
      display: none;
      background-color: darkgray;
      padding: 20px;
      color: white;
    }

    div:hover p {
      display: block;
    }

    div {
      background-color: #444;
      padding: 15px;
      cursor: pointer;
      color: white;
      width: 300px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    a:link {
      color: rgb(0, 255, 38);
      text-decoration: none;
      font-size: 18px;
    }

    a:hover {
      color: rgb(0, 183, 255);
      text-decoration: underline;
      font-weight: bold;
    }

  </style>
</head>
<body>

  <h2>Pseudo Selector CSS</h2>

  <h3>Hover pada DIV digunakan untuk menampilkan paragraf tersembunyi</h3>
  <div>
    Letakkan kursor disini untuk melihat div elemen
    <p>Saya adalah element Ferdinand Ganteng</p>
  </div>

  <div class="link-demo">
    <h3>Link akan berubah warna ketika di hover</h3>
    <p style="display:block; background:none; color:black; padding:0;">
      <a href="#">Arahkan mouse anda ke sini - link akan berubah warna!</a>
    </p>
  </div>

</body>
</html>
