<html>
<head>
<style>
  div {
    border: 1px solid black;
    margin: 40px 50px 60px 30px;
    background-color: lightblue;
    padding: 10px;
  }
</style>
</head>
<body>

  <h3>Mengatur Margin</h3>
  <div>Elemen ini memiliki margin atas 40px, kanan 50px,
    bawah 60px, dan kiri 30px.</div>

  <p style="font-size:17px; color:#555;">
    <strong> Kesimpulan </strong> : Properti margin digunakan untuk mengatur jarak antara elemen
    dengan elemen lain yang berada pada luar border. Urutan nilainya: atas → kanan → bawah → kiri
    searah dengan arah jarum jam.
  </p>

</body>
</html>
